<script type="module">

const params = new URLSearchParams(location.search);
const W = +params.get('w') || 1080, H = +params.get('h') || 1920;
const sceneName = params.get('scene');
window.RES = H / 1280;

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const out = document.createElement('canvas');
out.width = W; out.height = H;
document.body.appendChild(out);
const ctx = out.getContext('2d');

const mod = await import(`./scenes/${sceneName}.js?v=${Date.now()}`);
const S = await mod.create({ THREE, renderer, W, H });
const VOFF = -H * (params.has('voff') ? +params.get('voff') : 0.09);

const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.6, 0.5, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());
// ---- polish standard (Nov 12): soft image-based fill light, colour grade, tilt-shift background blur ----
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const envOK = new WeakMap();
const blurC = document.createElement('canvas'); blurC.width = W; blurC.height = H; const bctx = blurC.getContext('2d');

// film grain texture
const grain = document.createElement('canvas'); grain.width = 256; grain.height = 256;
{ const g = grain.getContext('2d'); const d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
  g.putImageData(d, 0, 0); }

  const st = S.update(t) || {};
  if (st.scene) { rp.scene = st.scene; rp.camera = st.camera; }
  const cm = st.camera || S.camera; cm.setViewOffset(W, H, 0, (st.voff ?? 1) * VOFF, W, H);
  bloom.strength = st.bloom ?? 0.6;
  bloom.threshold = st.bloomThreshold ?? 0.85;
  bloom.radius = st.bloomRadius ?? 0.5;
  renderer.toneMappingExposure = st.exposure ?? 1.0;
  { const scn = st.scene || S.scene; if (!envOK.has(scn)) { let h = false; scn.traverse(o => { if (o.isHemisphereLight) h = true; }); envOK.set(scn, h); if (h && !scn.environment) scn.environment = envTex; }
    if (envOK.get(scn)) scn.environmentIntensity = st.env ?? 0.28; }

  ctx.drawImage(renderer.domElement, -W*(sc-1)/2+ox, -H*(sc-1)/2+oy, W*sc, H*sc);
  ctx.filter = 'none';
  // tilt-shift depth-of-field: sharp band around st.focusY (0..1 of height), soft above and below. st.dof = 0 turns it off.
  const dof = st.dof ?? 0.55;

    bctx.globalCompositeOperation = 'source-over'; bctx.clearRect(0, 0, W, H); bctx.filter = `blur(${(dof * 6 * window.RES).toFixed(2)}px)`; bctx.drawImage(out, -8, -8, W + 16, H + 16); bctx.filter = 'none';
    const mg = bctx.createLinearGradient(0, 0, 0, H); const c01 = v => Math.min(1, Math.max(0, v));
    mg.addColorStop(0, `rgba(0,0,0,${c01((fy - fh) / ramp)})`); mg.addColorStop(c01(fy - fh), 'rgba(0,0,0,0)'); mg.addColorStop(c01(fy + fh), 'rgba(0,0,0,0)'); mg.addColorStop(1, `rgba(0,0,0,${c01((1 - fy - fh) / ramp)})`);
    bctx.globalCompositeOperation = 'destination-in'; bctx.fillStyle = mg; bctx.fillRect(0, 0, W, H); ctx.drawImage(blurC, 0, 0); }
  // vignette

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${st.vignette ?? 0.55})`);

};
window.sceneInfo = S.info || {};
window.ready = true;
</script>
