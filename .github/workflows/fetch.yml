name: fetch-media
on:
  push:
    paths: ['fetch/*.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download listed files
        run: |
          mkdir -p fetched
          for f in fetch/*.txt; do
            while read -r name url; do
              [ -z "$name" ] && continue
              [ -f "fetched/$name" ] && continue
              curl -sSL --fail -o "fetched/$name" "$url"
            done < "$f"
          done
      - name: commit
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add fetched && git commit -m "fetched media" && git push || echo nothing
